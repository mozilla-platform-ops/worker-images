run-name: OS Integration Tests - ${{ inputs.config }}
name: OS Integration Tests - FXCI

on:
  workflow_dispatch:
    inputs:
      config:
        type: string
        required: true
        description: YAML basename from config/ (without .yaml)
      image_name:
        type: string
        description: Optional shared image name override
        required: false
      wait_for_results:
        type: boolean
        default: true
        description: Wait for task results (false only submits and prints the task-group link)
  workflow_call:
    inputs:
      config:
        type: string
        description: Config name from config/
        required: true
      image_name:
        type: string
        description: Optional shared image name override
        required: false
      wait_for_results:
        type: boolean
        default: true
        description: Wait for task results
    secrets:
      TASKCLUSTER_OS_INT_CLIENT_ID:
        required: true
      TASKCLUSTER_OS_INT_ACCESS_TOKEN:
        required: true

env:
  CONFIG: ${{ inputs.config }}

jobs:
  integration-tests:
    name: "Trigger Integration Tests"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Validate image config
        shell: pwsh
        run: ./ci/validate-image-config.ps1 -Family all
      - name: Verify User Access
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: ./ci/check-authorized-user.ps1

      - name: Resolve shared image name
        id: resolve-image
        shell: pwsh
        env:
          CONFIG: ${{ inputs.config }}
          IMAGE_NAME_INPUT: ${{ inputs.image_name }}
        run: |
          if ($env:IMAGE_NAME_INPUT) {
            $imageName = $env:IMAGE_NAME_INPUT
          } else {
            ./ci/install-powershell-yaml.ps1
            $yaml = ConvertFrom-Yaml (Get-Content "config/$($env:CONFIG).yaml" -Raw)
            # Windows configs use sharedimage.image_name (Azure Shared Image Gallery name).
            # Linux GCP configs use image.image_name (GCP image name).
            if ($yaml.sharedimage.image_name) {
              $imageName = $yaml.sharedimage.image_name
            } else {
              $imageName = $yaml.image.image_name
            }
          }

          if (-not $imageName) {
            Write-Host "::error ::Unable to determine image name from config/$($env:CONFIG).yaml"
            exit 1
          }

          "image_name=$imageName" >> $env:GITHUB_OUTPUT
          Write-Host "Resolved image name: $imageName"
      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
      - name: Run OS Integration Tests
        env:
          IMAGE_NAME: ${{ steps.resolve-image.outputs.image_name }}
          TASKCLUSTER_CLIENT_ID: ${{ secrets.TASKCLUSTER_OS_INT_CLIENT_ID }}
          TASKCLUSTER_ACCESS_TOKEN: ${{ secrets.TASKCLUSTER_OS_INT_ACCESS_TOKEN }}
          PYTHONUNBUFFERED: "1"
          WAIT_FOR_RESULTS: ${{ inputs.wait_for_results }}
        run: |
          args=("$IMAGE_NAME")
          if [[ "$WAIT_FOR_RESULTS" != true ]]; then args+=(--no-wait); fi
          uv run ci/run-os-integration.py "${args[@]}"
