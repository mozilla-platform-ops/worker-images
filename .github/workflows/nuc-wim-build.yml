name: NUC WIM Build
run-name: "NUC WIM build - ${{ inputs.image }} @ ${{ inputs.pipeline_ref }}"

# Kicks off a baked NUC install.wim build on the Azure nested-virt build host.
# The pipeline itself lives on a feature branch (default: nuc-wim-pipeline) under
# provisioners/windows/nuc-wim/ — this workflow points the build at that branch.
#
# Prerequisites (one-time):
#   - The Azure build VM exists (provisioners/windows/nuc-wim/New-NucWimBuildVm.ps1).
#   - An OIDC service principal with a federated credential for this repo, granted
#     Virtual Machine Contributor on rg-central-us-nuc-wim. Wire its ids as secrets:
#       NUC_WIM_AZURE_CLIENT_ID, NUC_WIM_AZURE_SUBSCRIPTION_ID, AZURE_TENANT_ID (existing).

on:
  workflow_dispatch:
    inputs:
      image:
        description: "Image config to build (config/<image>.yaml)"
        type: string
        default: win11-24h2-hw
      pipeline_ref:
        description: "worker-images branch holding provisioners/windows/nuc-wim"
        type: string
        default: nuc-wim-pipeline
      build_id:
        description: "Optional build id (default: timestamp on the VM)"
        type: string
        default: ""

permissions:
  id-token: write
  contents: read

jobs:
  check-access:
    name: Verify User Access
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Load Authorized Users and Check Access
        shell: pwsh
        run: ./ci/check-authorized-user.ps1

  kickoff:
    name: Kick off build on Azure host
    needs: check-access
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Azure Login
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43
        with:
          client-id: ${{ secrets.NUC_WIM_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.NUC_WIM_AZURE_SUBSCRIPTION_ID }}

      - name: Kick off NUC WIM build
        shell: pwsh
        env:
          IMAGE: ${{ inputs.image }}
          PIPELINE_REF: ${{ inputs.pipeline_ref }}
          BUILD_ID: ${{ inputs.build_id }}
        run: ./ci/kickoff-nuc-wim-build.ps1
