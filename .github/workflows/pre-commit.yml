name: linting

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.11'

    - name: Check Azure upload archives
      shell: pwsh
      run: |
        Install-PSResource powershell-yaml -Version 0.4.12 -TrustRepository -Quiet
        ./ci/test-azure-upload-archives.ps1

    - name: Install pre-commit
      run: pip install pre-commit

    - name: Install uv
      uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4

    - name: Check image cache seeds
      run: |
        # Test the runner's Mercurial package, including Ubuntu's patches.
        sudo apt-get update
        sudo apt-get install -y mercurial
        hg version
        uv run --python 3.11 scripts/cache-seeds/test_gecko_hg.py
        curl --fail --location --retry 3 https://hg.mozilla.org/integration/autoland/raw-file/6978ac4b671864859416a7e5487211832eba1498/taskcluster/scripts/run-task -o "$RUNNER_TEMP/run-task-hg"
        sudo env PATH="$PATH" RUN_TASK="$RUNNER_TEMP/run-task-hg" uv run --python 3.11 scripts/cache-seeds/test_gecko_hg.py SeedTest.test_store_and_registration
        # Puppet installs 6.2.1 on Windows ARM64 and 6.9 on Windows x64.
        uv run --python 3.10 --with mercurial==6.2.1 scripts/cache-seeds/test_gecko_hg.py
        uv run --python 3.11 --with mercurial==6.9 scripts/cache-seeds/test_gecko_hg.py
        uv run --with pyyaml scripts/cache-seeds/test_git_seed.py
        uv run scripts/cache-seeds/test_benchmark.py
        uv run taskcluster/test/test_run_os_integration.py

    - name: Cache pre-commit environments
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/pre-commit
        key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

    - name: Run pre-commit on all files
      run: |
        echo "Running pre-commit on all files"
        pre-commit run --all-files

  shellcheck:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Get changed shell files
      id: changed-shell-files
      uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
      with:
        files: |
          **/*.sh
          **/*.bash
          **/*.ksh
          **/*.zsh

    - name: Run ShellCheck
      if: steps.changed-shell-files.outputs.any_changed == 'true'
      uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # v2.0.0
      with:
        scandir: '.'
        format: gcc
        severity: warning
        additional_files: ${{ steps.changed-shell-files.outputs.all_changed_files }}

    - name: Skip shellcheck if no shell files changed
      if: steps.changed-shell-files.outputs.any_changed == 'false'
      run: |
        echo "No shell files changed, skipping shellcheck"

  psscriptanalyzer:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Get changed PowerShell test files
      id: changed-ps-files
      uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
      with:
        files: |
          tests/**/*.ps1

    - name: Run PSScriptAnalyzer
      if: steps.changed-ps-files.outputs.any_changed == 'true'
      shell: pwsh
      run: |
        Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser
        $results = Invoke-ScriptAnalyzer -Path tests/ -Settings tests/PSScriptAnalyzerSettings.psd1 -Recurse
        if ($results) {
            $results | Format-Table -AutoSize
            Write-Error "PSScriptAnalyzer found $($results.Count) issue(s)"
            exit 1
        }
        Write-Host "PSScriptAnalyzer: no issues found"

    - name: Skip PSScriptAnalyzer if no test files changed
      if: steps.changed-ps-files.outputs.any_changed == 'false'
      run: |
        echo "No PowerShell test files changed, skipping PSScriptAnalyzer"
