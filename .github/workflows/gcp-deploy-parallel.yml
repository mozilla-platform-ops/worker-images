name: FXCI - GCP Prod Parallel Images
run-name: GCP Production - ${{ inputs.config || 'all' }} - ${{ github.sha }}

on:
  workflow_dispatch:
    inputs:
      config:
        type: choice
        description: Choose one image to promote or all production images
        options:
          - all
          - gw-fxci-gcp-l1-2404-gui-alpha
          - gw-fxci-gcp-l1-2404-headless-alpha
          - gw-fxci-gcp-l1-2404-arm64-headless-alpha
          - trusted-gw-fxci-gcp-l3-2404-headless-alpha
          - trusted-gw-fxci-gcp-l3-2404-arm64-headless-alpha
        default: all
        required: true
      run_os_integration:
        type: boolean
        description: Run OS integration tests for newly built untrusted images
        default: true
  workflow_call:
    inputs:
      build_date:
        description: UTC production date shared across the deployment
        required: false
        type: string
      config:
        description: Optional GCP production config; omit or use all for every image
        required: false
        type: string
      run_os_integration:
        description: Run OS integration tests for newly built untrusted images
        required: false
        type: boolean
        default: true

permissions:
  id-token: write
  contents: read

jobs:
  prepare-matrix:
    name: Prepare GCP Production Matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      os_integration_matrix: ${{ steps.set-matrix.outputs.os_integration_matrix }}
      has_os_integration: ${{ steps.set-matrix.outputs.has_os_integration }}
      build_date: ${{ steps.set-matrix.outputs.build_date }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - id: set-matrix
        name: Extract GCP production configs
        shell: pwsh
        env:
          BUILD_DATE: ${{ inputs.build_date }}
          CONFIG: ${{ inputs.config }}
        run: |
          $buildDate = $env:BUILD_DATE
          if ([string]::IsNullOrWhiteSpace($buildDate)) {
            $buildDate = [DateTime]::UtcNow.ToString("yyyy-MM-dd")
          }
          $parsedBuildDate = [DateTime]::ParseExact(
            $buildDate,
            "yyyy-MM-dd",
            [Globalization.CultureInfo]::InvariantCulture
          )
          $buildDate = $parsedBuildDate.ToString("yyyy-MM-dd", [Globalization.CultureInfo]::InvariantCulture)
          "build_date=$buildDate" >> $env:GITHUB_OUTPUT

          $availableConfigs = @(
            Get-ChildItem -Path ./config -File -Filter "*.yaml" |
              ForEach-Object { $_.BaseName } |
              Where-Object { $_ -match '^(trusted-)?gw-fxci-gcp-.*-alpha$' } |
              Sort-Object
          )
          if ($availableConfigs.Count -eq 0) {
            throw "No GCP production configs found in ./config."
          }

          $selectedConfig = $env:CONFIG
          if ([string]::IsNullOrWhiteSpace($selectedConfig) -or $selectedConfig -ieq 'all') {
            $configs = $availableConfigs
          } elseif ($availableConfigs -cnotcontains $selectedConfig) {
            throw "Unknown GCP production config '$selectedConfig'."
          } else {
            $configs = @($selectedConfig)
          }

          $matrix = @{ config = @($configs) } | ConvertTo-Json -Compress
          Write-Host "Generated matrix: $matrix"
          "matrix=$matrix" >> $env:GITHUB_OUTPUT

          # Only untrusted configs have matching alpha worker pools.
          $osIntConfigs = @($configs | Where-Object { $_ -notmatch '^trusted-' })
          $osIntMatrix = @{ config = @($osIntConfigs) } | ConvertTo-Json -Compress
          Write-Host "Generated os-integration matrix: $osIntMatrix"
          "os_integration_matrix=$osIntMatrix" >> $env:GITHUB_OUTPUT
          "has_os_integration=$(if ($osIntConfigs.Count -gt 0) { 'true' } else { 'false' })" >> $env:GITHUB_OUTPUT

  check-access:
    name: Verify User Access
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Load Authorized Users and Check Access
        uses: ./.github/actions/check-workerimages-user-authorization
        with:
          app_id: ${{ secrets.WORKER_IMAGES_TEAMS_APP_ID }}
          private_key: ${{ secrets.WORKER_IMAGES_TEAMS_KEY }}

  prodimage:
    needs: [check-access, prepare-matrix]
    name: GCP ${{ matrix.config }}
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: write
      id-token: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - id: set-gcp-vars
        name: Get Project ID and Image Name from Config
        shell: pwsh
        run: |
          Import-Module ${{ github.workspace }}\bin\WorkerImages\WorkerImages.psm1
          Set-GCPWorkerImageName -Key '${{ matrix.config }}'
          Set-GCPWorkerImageProject -Key '${{ matrix.config }}'

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        id: auth
        with:
          workload_identity_provider: "projects/324168772199/locations/global/workloadIdentityPools/github-actions/providers/github-actions"
          service_account: "deploy-prod@${{ steps.set-gcp-vars.outputs.PROJECT }}.iam.gserviceaccount.com"

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db

      - name: Build Alpha Source Image
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module ./bin/WorkerImages/WorkerImages.psm1 -Force
          New-GCPWorkerImage -Key '${{ matrix.config }}' -Github_token $env:GITHUB_TOKEN
          if ($LASTEXITCODE -ne 0) {
            throw "Packer alpha build failed with exit code $LASTEXITCODE."
          }

      - name: Scan Alpha Source Image with Wiz
        if: ${{ !startsWith(matrix.config, 'trusted-') }}
        uses: ./.github/actions/scan-gcp-image-with-wiz
        with:
          image_name: ${{ steps.set-gcp-vars.outputs.IMAGENAME }}
          project_id: ${{ steps.set-gcp-vars.outputs.PROJECT }}
          client_id: ${{ secrets.WIZ_CLIENT_ID }}
          client_secret: ${{ secrets.WIZ_CLIENT_SECRET }}

      - name: Upload Alpha Release Notes Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-notes-alpha-${{ matrix.config }}
          path: sboms/${{ steps.set-gcp-vars.outputs.IMAGENAME }}.md
          overwrite: true
          retention-days: 1
          if-no-files-found: error

      - name: Build Production Image
        shell: pwsh
        env:
          BUILD_DATE: ${{ needs.prepare-matrix.outputs.build_date }}
          PROJECT_ID: ${{ steps.set-gcp-vars.outputs.PROJECT }}
        run: |
          Import-Module ./bin/WorkerImages/WorkerImages.psm1 -Force
          $ProdImageName = -join(('${{ steps.set-gcp-vars.outputs.IMAGENAME }}' -Replace "alpha"),$env:BUILD_DATE)
          $exists = gcloud compute images describe $ProdImageName
          if ($exists) {
            if (Test-GCPImageReferencedInFxciConfig -Project $env:PROJECT_ID -ImageName $ProdImageName) {
              throw "Refusing to delete projects/$env:PROJECT_ID/global/images/${ProdImageName}: fxci-config/main references this image."
            }
            gcloud compute images delete $ProdImageName --quiet
          }
          Write-Output "Creating image $ProdImageName"
          gcloud compute images create $ProdImageName `
          --source-image ${{ steps.set-gcp-vars.outputs.IMAGENAME }} `
          --source-image-project ${{ steps.set-gcp-vars.outputs.PROJECT }} `
          --force

      - id: create-production-sbom
        name: Create Production SBOM Record
        shell: pwsh
        env:
          BUILD_DATE: ${{ needs.prepare-matrix.outputs.build_date }}
        run: |
          $ProdImageName = -join(('${{ steps.set-gcp-vars.outputs.IMAGENAME }}' -Replace "alpha"),$env:BUILD_DATE)
          $AlphaImageName = '${{ steps.set-gcp-vars.outputs.IMAGENAME }}'
          $AlphaSbomPath = "sboms/$AlphaImageName.md"
          $ProductionSbomPath = "sboms/$ProdImageName.md"
          $AlphaSbomHash = (Get-FileHash -Algorithm SHA256 $AlphaSbomPath).Hash.ToLowerInvariant()
          $PromotionTimestamp = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          $Header = @"
          # Production deployment record

          - Production image name: ``$ProdImageName``
          - Alpha source image name: ``$AlphaImageName``
          - Promotion timestamp: ``$PromotionTimestamp``
          - Promotion copied the alpha image without rebuilding the filesystem.
          - SHA-256 of the unmodified alpha SBOM: ``$AlphaSbomHash``

          ---

          "@
          $HeaderBytes = [System.Text.Encoding]::UTF8.GetBytes($Header)
          $AlphaSbomBytes = [System.IO.File]::ReadAllBytes((Resolve-Path $AlphaSbomPath))
          [System.IO.File]::WriteAllBytes($ProductionSbomPath, $HeaderBytes + $AlphaSbomBytes)
          "production_sbom=$ProductionSbomPath" >> $env:GITHUB_OUTPUT

      - name: Upload Production SBOM Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-notes-production-${{ matrix.config }}
          path: ${{ steps.create-production-sbom.outputs.production_sbom }}
          overwrite: true
          retention-days: 90
          if-no-files-found: error

  sbom:
    needs: prodimage
    permissions:
      actions: read
      contents: write
    uses: ./.github/workflows/upload-release-notes.yml
    with:
      artifact_pattern: release-notes-*
      commit_message: GCP Production Release Notes

  os-integration:
    needs: [prepare-matrix, sbom]
    if: ${{ inputs.run_os_integration && needs.prepare-matrix.outputs.has_os_integration == 'true' }}
    name: "OS Integration Tests - ${{ matrix.config }}"
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare-matrix.outputs.os_integration_matrix) }}
    uses: ./.github/workflows/os-integration.yml
    with:
      config: ${{ matrix.config }}
    secrets:
      TASKCLUSTER_OS_INT_CLIENT_ID: ${{ secrets.TASKCLUSTER_OS_INT_CLIENT_ID }}
      TASKCLUSTER_OS_INT_ACCESS_TOKEN: ${{ secrets.TASKCLUSTER_OS_INT_ACCESS_TOKEN }}
