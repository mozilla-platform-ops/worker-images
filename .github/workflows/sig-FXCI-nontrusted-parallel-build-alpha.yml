name: FXCI - Azure Alpha Parallel Images
run-name: Azure Alpha Parallel - ${{ github.sha }}

on:
  workflow_dispatch:
    inputs:
      wait_for_results:
        type: boolean
        default: true
        description: Wait for OS integration results (false only submits tests)

permissions:
  id-token: write
  contents: read

jobs:
  prepare-matrix:
    name: Prepare Alpha Image Matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      os_integration_matrix: ${{ steps.set-matrix.outputs.os_integration_matrix }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install PowerShell-YAML module
        shell: pwsh
        run: |
          & "${{ github.workspace }}/ci/install-powershell-yaml.ps1"

      - id: set-matrix
        name: Extract `images.alpha` from YAML
        shell: pwsh
        run: |
          $yaml = ConvertFrom-Yaml (Get-Content ./config/windows_production_defaults.yaml -Raw)
          $alphaImages = $yaml.images.alpha

          if (-not $alphaImages -or $alphaImages.Count -eq 0) {
            Write-Host "::error ::No alpha images found in YAML"
            exit 1
          }

          $matrix = @{ config = $alphaImages } | ConvertTo-Json -Compress
          Write-Host "Generated matrix: $matrix"
          "matrix=$matrix" >> $env:GITHUB_OUTPUT

          $osIntImages = $alphaImages | Where-Object { $_ -notmatch '^win2022' -and $_ -notmatch '^win11-a64.*builder' }
          $osIntMatrix = @{ config = @($osIntImages) } | ConvertTo-Json -Compress
          Write-Host "Generated os-integration matrix: $osIntMatrix"
          "os_integration_matrix=$osIntMatrix" >> $env:GITHUB_OUTPUT

  packer:
    needs: [prepare-matrix]
    name: "Build ${{ matrix.config }}"
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare-matrix.outputs.matrix) }}
    uses: ./.github/workflows/build-azure-image.yml
    with:
      config: ${{ matrix.config }}
    secrets:
      client-id: ${{ secrets.AZURE_CLIENT_ID_FXCI }}
      application-id: ${{ secrets.AZURE_APPLICATION_ID_FXCI }}
      subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID_UNTRUSTED }}
      tenant-id: ${{ secrets.AZURE_TENANT_ID }}

  sbom:
    if: ${{ always() }}
    needs: [prepare-matrix, packer]
    permissions:
      actions: read
      contents: write
    uses: ./.github/workflows/upload-release-notes.yml

  find-successful-builds:
    needs: [prepare-matrix, packer]
    name: "Filter os-integration matrix to successful packer builds"
    runs-on: ubuntu-latest
    if: ${{ !cancelled() }}
    permissions:
      actions: read
    outputs:
      os_integration_matrix: ${{ steps.filter.outputs.os_integration_matrix }}
      os_integration_count: ${{ steps.filter.outputs.os_integration_count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - id: filter
        name: Query run jobs API for successful packer entries
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ORIGINAL_OS_INT_MATRIX: ${{ needs.prepare-matrix.outputs.os_integration_matrix }}
        run: |
          & "${{ github.workspace }}/ci/find-successful-builds.ps1"

  os-integration:
    needs: [find-successful-builds]
    if: ${{ !cancelled() && needs.find-successful-builds.result == 'success' && needs.find-successful-builds.outputs.os_integration_count != '0' }}
    name: "OS Integration Tests - ${{ matrix.config }}"
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.find-successful-builds.outputs.os_integration_matrix) }}
    uses: ./.github/workflows/os-integration.yml
    with:
      config: ${{ matrix.config }}
      wait_for_results: ${{ inputs.wait_for_results }}
    secrets:
      TASKCLUSTER_OS_INT_CLIENT_ID: ${{ secrets.TASKCLUSTER_OS_INT_CLIENT_ID }}
      TASKCLUSTER_OS_INT_ACCESS_TOKEN: ${{ secrets.TASKCLUSTER_OS_INT_ACCESS_TOKEN }}
