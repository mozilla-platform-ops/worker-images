run-name: TCEng GCP - ${{ github.event.inputs.config }}
name: TCEng GCP

on:
  workflow_dispatch:
    inputs:
      config:
        type: string
        required: true
        description: YAML basename from config/ (without .yaml)
      TASKCLUSTER_REF:
        type: string
        description: Git reference (branch, tag, or commit) to use
        default: main

permissions:
  id-token: write
  contents: read

env:
  CONFIG: ${{ inputs.config }}

jobs:
  check-access:
    name: "Verify User Access"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Validate image config
        shell: pwsh
        run: ./ci/validate-image-config.ps1 -Family tceng

      - name: Load Authorized Users and Check Access
        shell: pwsh
        run: ./ci/check-authorized-user.ps1 -IncludeTCEng

  setproject:
    needs: check-access
    name: "Get Project ID & ImageName from Config"
    runs-on: ubuntu-latest
    outputs:
      IMAGENAME: ${{ steps.set-matrix.outputs.IMAGENAME }}
      PROJECT:   ${{ steps.set-matrix.outputs.PROJECT }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Validate image config
        shell: pwsh
        run: ./ci/validate-image-config.ps1 -Family tceng
      - id: set-matrix
        shell: pwsh
        run: |
          Import-Module "${{ github.workspace }}/bin/WorkerImages/WorkerImages.psm1"
          Set-GCPWorkerImageMetadata    -Key $env:CONFIG -Team 'tceng'

  packer:
    needs: setproject
    name: "GCP ${{ github.event.inputs.config }}"
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Validate image config
        shell: pwsh
        run: ./ci/validate-image-config.ps1 -Family tceng

      - uses: 'google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093'
        id: auth
        with:
          workload_identity_provider: "projects/324168772199/locations/global/workloadIdentityPools/github-actions/providers/github-actions"
          service_account: "deploy-prod@${{ needs.setproject.outputs.PROJECT }}.iam.gserviceaccount.com"

      - name: Cache Packer plugins
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.config/packer/plugins
          key: packer-gcp-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gcp.pkr.hcl', 'packer/tceng-gcp.pkr.hcl') }}
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db

      - name: Setup Packer
        uses: hashicorp/setup-packer@ce93c3c08a6c2ff2275bf4b54ff0d9a75f6c9789

      - name: Run Packer
        shell: pwsh
        env:
          GITHUB_TOKEN:       ${{ secrets.GITHUB_TOKEN }}
          TASKCLUSTER_REF:    ${{ github.event.inputs.TASKCLUSTER_REF }}
        run: |
          $ENV:PKR_VAR_taskcluster_ref = $ENV:TASKCLUSTER_REF
          Import-Module "${{ github.workspace }}/bin/WorkerImages/WorkerImages.psm1"
          $Vars = @{
            github_token       = $env:GITHUB_TOKEN
            Key                = $env:CONFIG
            Team               = "tceng"   # ensure tceng HCL/YAML paths
          }
          New-GCPWorkerImage @Vars
