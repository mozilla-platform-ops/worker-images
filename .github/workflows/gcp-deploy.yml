run-name: GCP Production - ${{ github.event.inputs.config }}
name: FXCI - GCP Production

on:
  workflow_dispatch:
    inputs:
      config:
        type: choice
        description: Choose which pool to build
        options:
        - gw-fxci-gcp-l1-2404-gui-alpha
        - gw-fxci-gcp-l1-2404-headless-alpha
        - gw-fxci-gcp-l1-2404-arm64-headless-alpha
        - trusted-gw-fxci-gcp-l3-2404-headless-alpha
        - trusted-gw-fxci-gcp-l3-2404-arm64-headless-alpha

permissions:
  id-token: write
  contents: read

jobs:
  check-access:
    name: "Verify User Access"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Load Authorized Users and Check Access
        shell: pwsh
        run: |
          $AUTHORIZED_USERS=$(Get-Content .github/relsre.json | Convertfrom-Json)
          if ($authorized_users -contains "${{ github.actor }}") {
            Write-host "User ${{ github.actor }} is authorized."
          }
          else {
            Write-Host "User ${{ github.actor }} is unauthorized."
            exit 1
          }
  setproject:
    needs: check-access
    name: "Get Project ID & ImageName from Config"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - id: set-matrix
        shell: pwsh
        run: |
          Import-Module ${{ github.workspace }}\bin\WorkerImages\WorkerImages.psm1
          Set-GCPWorkerImageName -Key '${{ github.event.inputs.config }}'
          Set-GCPWorkerImageProject -Key '${{ github.event.inputs.config }}'
    outputs:
      IMAGENAME: ${{ steps.set-matrix.outputs.IMAGENAME }}
      PROJECT: ${{ steps.set-matrix.outputs.PROJECT }}
  prodimage:
    needs: setproject
    name: "GCP ${{ github.event.inputs.config }}"
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: 'google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093'
        id: auth
        with:
          workload_identity_provider: "projects/324168772199/locations/global/workloadIdentityPools/github-actions/providers/github-actions"
          service_account: "deploy-prod@${{ needs.setproject.outputs.PROJECT }}.iam.gserviceaccount.com"
      - name: 'Set up Cloud SDK'
        uses: 'google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db'
      - name: 'Build Production Image'
        shell: pwsh
        run: |
          $date = Get-Date -Format "yyyy-MM-dd"
          $ProdImageName = -join(('${{ needs.setproject.outputs.IMAGENAME }}' -Replace "alpha"),$date)
          $exists = gcloud compute images describe $ProdImageName
          if ($exists) {
            gcloud compute images delete $ProdImageName --quiet
          }
          Write-Output "Creating image $ProdImageName"
          gcloud compute images create $ProdImageName `
          --source-image ${{ needs.setproject.outputs.IMAGENAME }} `
          --source-image-project ${{ needs.setproject.outputs.PROJECT }} `
          --force

      - id: create-production-sbom
        name: Create Production SBOM Record
        shell: pwsh
        run: |
          $date = Get-Date -Format "yyyy-MM-dd"
          $ProdImageName = -join(('${{ needs.setproject.outputs.IMAGENAME }}' -Replace "alpha"),$date)
          $AlphaImageName = '${{ needs.setproject.outputs.IMAGENAME }}'
          $AlphaSbomPath = "sboms/$AlphaImageName.md"
          $ProductionSbomPath = "sboms/$ProdImageName.md"
          $AlphaSbomHash = (Get-FileHash -Algorithm SHA256 $AlphaSbomPath).Hash.ToLowerInvariant()
          $PromotionTimestamp = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          $Header = @"
          # Production deployment record

          - Production image name: ``$ProdImageName``
          - Alpha source image name: ``$AlphaImageName``
          - Promotion timestamp: ``$PromotionTimestamp``
          - Promotion copied the alpha image without rebuilding the filesystem.
          - SHA-256 of the unmodified alpha SBOM: ``$AlphaSbomHash``

          ---

          "@
          $HeaderBytes = [System.Text.Encoding]::UTF8.GetBytes($Header)
          $AlphaSbomBytes = [System.IO.File]::ReadAllBytes((Resolve-Path $AlphaSbomPath))
          [System.IO.File]::WriteAllBytes($ProductionSbomPath, $HeaderBytes + $AlphaSbomBytes)
          "production_sbom=$ProductionSbomPath" >> $env:GITHUB_OUTPUT

      - name: Upload Production SBOM Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-notes-production-${{ github.event.inputs.config }}
          path: ${{ steps.create-production-sbom.outputs.production_sbom }}
          overwrite: true
          retention-days: 1
          if-no-files-found: error

  sbom:
    needs: prodimage
    permissions:
      actions: read
      contents: write
    uses: ./.github/workflows/upload-release-notes.yml
    with:
      artifact_pattern: release-notes-production-${{ github.event.inputs.config }}
      commit_message: ${{ github.event.inputs.config }} - Production Release Notes
