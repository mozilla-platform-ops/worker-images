name: Upload Release Notes

on:
  workflow_call:
    inputs:
      artifact_pattern:
        type: string
        default: release-notes-*
      commit_message:
        type: string
        default: Update release notes

permissions:
  contents: read

jobs:
  sbom:
    name: Prepare release-note branch
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
      - name: Publish validated artifacts to an SBOM branch
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.run_id }}
          SOURCE_RUN_ATTEMPT: ${{ github.run_attempt }}
          ARTIFACT_PATTERN: ${{ inputs.artifact_pattern }}
          COMMIT_MESSAGE: ${{ inputs.commit_message }}
        run: python3 ci/sbom_pr.py publish
