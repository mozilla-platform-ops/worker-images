name: Upload Release Notes

on:
  workflow_call:
    inputs:
      artifact_pattern:
        type: string
        default: release-notes-*
      commit_message:
        type: string
        default: Update release notes

jobs:
  sbom:
    name: Upload release notes
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    concurrency:
      group: release-notes-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          path: sboms
          pattern: ${{ inputs.artifact_pattern }}
          merge-multiple: true
      - name: Validate downloaded release notes
        shell: bash
        run: |
          if ls sboms/*.md >/dev/null 2>&1; then
            echo "Downloaded release notes:"
            ls -1 sboms/*.md
          else
            echo "No release notes were downloaded from successful packer jobs."
            exit 1
          fi
      - name: Pull latest main
        run: git pull --rebase --autostash origin main
      - name: Commit release notes to main
        uses: stefanzweifel/git-auto-commit-action@d0b01107b5db882071f96de5dd4b54961ea93f4c
        with:
          branch: main
          commit_message: ${{ inputs.commit_message }}
          file_pattern: sboms/*.md
