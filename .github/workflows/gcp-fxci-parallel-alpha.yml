name: FXCI - GCP Alpha Images
run-name: GCP Alpha - ${{ inputs.config }}

on:
  workflow_dispatch:
    inputs:
      config:
        type: choice
        description: Choose one image to build or all alpha images
        options:
          - all
          - gw-fxci-gcp-l1-2404-gui-alpha
          - gw-fxci-gcp-l1-2404-headless-alpha
          - gw-fxci-gcp-l1-2404-arm64-headless-alpha
          - trusted-gw-fxci-gcp-l3-2404-headless-alpha
          - trusted-gw-fxci-gcp-l3-2404-arm64-headless-alpha
        default: all
        required: true
      run_os_integration:
        type: boolean
        description: For one untrusted image, opt into integration tests; all mode tests successful untrusted builds
        default: false

permissions:
  id-token: write
  contents: read

jobs:
  prepare-matrix:
    name: Prepare GCP Alpha Matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      os_integration_matrix: ${{ steps.set-matrix.outputs.os_integration_matrix }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - id: set-matrix
        name: Extract GCP alpha configs
        shell: pwsh
        env:
          CONFIG: ${{ inputs.config }}
          RUN_OS_INTEGRATION: ${{ inputs.run_os_integration }}
        run: |
          $availableConfigs = @(
            Get-ChildItem -Path ./config -File -Filter "*.yaml" |
              ForEach-Object { $_.BaseName } |
              Where-Object { $_ -match '^(trusted-)?gw-fxci-gcp-.*-alpha$' } |
              Sort-Object
          )
          if ($availableConfigs.Count -eq 0) {
            throw "No GCP alpha image configs found in ./config."
          }

          $selectedConfig = $env:CONFIG
          if ([string]::IsNullOrWhiteSpace($selectedConfig) -or $selectedConfig -ieq 'all') {
            $configs = $availableConfigs
          } elseif ($availableConfigs -cnotcontains $selectedConfig) {
            throw "Unknown GCP alpha config '$selectedConfig'."
          } else {
            $configs = @($selectedConfig)
          }

          $matrix = @{ config = @($configs) } | ConvertTo-Json -Compress
          Write-Host "Generated matrix: $matrix"
          "matrix=$matrix" >> $env:GITHUB_OUTPUT

          # Only level-1 (untrusted) alpha configs have matching alpha worker pools.
          $osIntConfigs = @()
          if ($selectedConfig -ieq 'all') {
            $osIntConfigs = @($configs | Where-Object { $_ -notmatch '^trusted-' })
          } elseif ($env:RUN_OS_INTEGRATION -eq 'true' -and $selectedConfig -notmatch '^trusted-') {
            $osIntConfigs = @($configs)
          }
          $osIntMatrix = @{ config = @($osIntConfigs) } | ConvertTo-Json -Compress
          Write-Host "Generated os-integration matrix: $osIntMatrix"
          "os_integration_matrix=$osIntMatrix" >> $env:GITHUB_OUTPUT


  check-access:
    name: Verify User Access
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Load Authorized Users and Check Access
        uses: ./.github/actions/check-workerimages-user-authorization
        with:
          app_id: ${{ secrets.WORKER_IMAGES_TEAMS_APP_ID }}
          private_key: ${{ secrets.WORKER_IMAGES_TEAMS_KEY }}

  packer:
    needs: [check-access, prepare-matrix]
    name: Build ${{ matrix.config }}
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: write
      id-token: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - id: set-gcp-vars
        name: Set project and image metadata
        shell: pwsh
        run: |
          Import-Module ${{ github.workspace }}\bin\WorkerImages\WorkerImages.psm1
          Set-GCPWorkerImageName -Key '${{ matrix.config }}'
          Set-GCPWorkerImageProject -Key '${{ matrix.config }}'

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        id: auth
        with:
          workload_identity_provider: "projects/324168772199/locations/global/workloadIdentityPools/github-actions/providers/github-actions"
          service_account: "deploy-prod@${{ steps.set-gcp-vars.outputs.PROJECT }}.iam.gserviceaccount.com"

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db

      - name: Run Packer
        shell: pwsh
        run: |
          Import-Module ${{ github.workspace }}\bin\WorkerImages\WorkerImages.psm1
          $Vars = @{
            github_token = "${{ secrets.GITHUB_TOKEN }}"
            Key = '${{ matrix.config }}'
          }
          New-GCPWorkerImage @Vars

      - name: Upload Release Notes Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-notes-${{ matrix.config }}
          path: sboms/${{ steps.set-gcp-vars.outputs.IMAGENAME }}.md
          overwrite: true
          retention-days: 1
          if-no-files-found: error

  sbom:
    if: ${{ always() && needs.prepare-matrix.result == 'success' && (inputs.config == 'all' || needs.packer.result == 'success') }}
    needs: [prepare-matrix, packer]
    permissions:
      actions: read
      contents: write
    uses: ./.github/workflows/upload-release-notes.yml
    with:
      artifact_pattern: ${{ inputs.config == 'all' && 'release-notes-*' || format('release-notes-{0}', inputs.config) }}
      commit_message: ${{ inputs.config == 'all' && 'Update release notes' || format('{0} - Release Notes', inputs.config) }}

  find-successful-builds:
    needs: [prepare-matrix, packer]
    name: "Filter matrices to successful packer builds"
    runs-on: ubuntu-latest
    if: ${{ !cancelled() }}
    permissions:
      actions: read
    outputs:
      wiz_matrix: ${{ steps.filter.outputs.wiz_matrix }}
      has_wiz: ${{ steps.filter.outputs.has_wiz }}
      os_integration_matrix: ${{ steps.filter.outputs.os_integration_matrix }}
      has_os_integration: ${{ steps.filter.outputs.has_os_integration }}
    steps:
      - id: filter
        name: Query run jobs API for successful packer entries
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ORIGINAL_OS_INT_MATRIX: ${{ needs.prepare-matrix.outputs.os_integration_matrix }}
        run: |
          $allJobs = gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs" --paginate | ConvertFrom-Json
          $successful = @()
          foreach ($job in $allJobs.jobs) {
            if ($job.name -match '^Build (.+)$' -and $job.conclusion -eq 'success') {
              $successful += $matches[1]
            }
          }
          Write-Host "Successful packer configs: $($successful -join ', ')"

          # Wiz runs against every successful non-trusted build.
          $wizConfigs = @($successful | Where-Object { $_ -notmatch '^trusted-' })
          $wizMatrix = @{ config = $wizConfigs } | ConvertTo-Json -Compress
          Write-Host "wiz_matrix=$wizMatrix (count=$($wizConfigs.Count))"
          "wiz_matrix=$wizMatrix" >> $env:GITHUB_OUTPUT
          "has_wiz=$(if ($wizConfigs.Count -gt 0) { 'true' } else { 'false' })" >> $env:GITHUB_OUTPUT

          # Keep only original integration targets that succeeded in Packer.
          $original = ConvertFrom-Json $env:ORIGINAL_OS_INT_MATRIX
          $osIntConfigs = @($original.config | Where-Object { $successful -contains $_ })
          $osIntMatrix = @{ config = $osIntConfigs } | ConvertTo-Json -Compress
          Write-Host "os_integration_matrix=$osIntMatrix (count=$($osIntConfigs.Count))"
          "os_integration_matrix=$osIntMatrix" >> $env:GITHUB_OUTPUT
          "has_os_integration=$(if ($osIntConfigs.Count -gt 0) { 'true' } else { 'false' })" >> $env:GITHUB_OUTPUT

  wiz-scan:
    needs: [find-successful-builds]
    if: ${{ !cancelled() && inputs.config == 'all' && needs.find-successful-builds.result == 'success' && needs.find-successful-builds.outputs.has_wiz == 'true' }}
    name: "Wiz Scan - ${{ matrix.config }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.find-successful-builds.outputs.wiz_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - id: set-gcp-vars
        name: Set project and image metadata
        shell: pwsh
        run: |
          Import-Module ${{ github.workspace }}\bin\WorkerImages\WorkerImages.psm1
          Set-GCPWorkerImageName -Key '${{ matrix.config }}'
          Set-GCPWorkerImageProject -Key '${{ matrix.config }}'

      - uses: ./.github/actions/scan-gcp-image-with-wiz
        with:
          image_name: ${{ steps.set-gcp-vars.outputs.IMAGENAME }}
          project_id: ${{ steps.set-gcp-vars.outputs.PROJECT }}
          client_id: ${{ secrets.WIZ_CLIENT_ID }}
          client_secret: ${{ secrets.WIZ_CLIENT_SECRET }}

  wiz-scan-selected:
    needs: [find-successful-builds]
    if: ${{ !cancelled() && inputs.config != 'all' && needs.find-successful-builds.result == 'success' && needs.find-successful-builds.outputs.has_wiz == 'true' }}
    name: "Wiz scan - ${{ matrix.config }}"
    runs-on: ubuntu-latest
    environment: prod
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.find-successful-builds.outputs.wiz_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - id: set-gcp-vars
        name: Set project and image metadata
        shell: pwsh
        run: |
          Import-Module ${{ github.workspace }}\bin\WorkerImages\WorkerImages.psm1
          Set-GCPWorkerImageName -Key '${{ matrix.config }}'
          Set-GCPWorkerImageProject -Key '${{ matrix.config }}'

      - uses: ./.github/actions/scan-gcp-image-with-wiz
        with:
          image_name: ${{ steps.set-gcp-vars.outputs.IMAGENAME }}
          project_id: ${{ steps.set-gcp-vars.outputs.PROJECT }}
          client_id: ${{ secrets.WIZ_CLIENT_ID }}
          client_secret: ${{ secrets.WIZ_CLIENT_SECRET }}

  os-integration:
    needs: [find-successful-builds]
    if: ${{ !cancelled() && needs.find-successful-builds.result == 'success' && needs.find-successful-builds.outputs.has_os_integration == 'true' }}
    name: "OS Integration Tests - ${{ matrix.config }}"
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.find-successful-builds.outputs.os_integration_matrix) }}
    uses: ./.github/workflows/os-integration.yml
    with:
      config: ${{ matrix.config }}
    secrets:
      TASKCLUSTER_OS_INT_CLIENT_ID: ${{ secrets.TASKCLUSTER_OS_INT_CLIENT_ID }}
      TASKCLUSTER_OS_INT_ACCESS_TOKEN: ${{ secrets.TASKCLUSTER_OS_INT_ACCESS_TOKEN }}
