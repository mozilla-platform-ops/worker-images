name: FXCI - Azure Prod Parallel Images
run-name: Azure Production Parallel - ${{ github.sha }}

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      build_date:
        description: UTC production date shared across the deployment
        required: false
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  prepare-matrix:
    name: Prepare Production Image Matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      os_integration_matrix: ${{ steps.set-matrix.outputs.os_integration_matrix }}
      build_date: ${{ steps.set-matrix.outputs.build_date }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - id: set-matrix
        name: Extract Azure production configs
        shell: pwsh
        env:
          BUILD_DATE: ${{ inputs.build_date }}
        run: |
          Import-Module ./bin/WorkerImages/WorkerImages.psm1 -Force
          $matrix = Get-AzureProductionParallelMatrix -BuildDate $env:BUILD_DATE
          "build_date=$($matrix.BuildDate)" >> $env:GITHUB_OUTPUT
          "matrix=$($matrix.Matrix)" >> $env:GITHUB_OUTPUT
          "os_integration_matrix=$($matrix.OsIntegrationMatrix)" >> $env:GITHUB_OUTPUT

  check-access:
    name: "Verify User Access"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Load Authorized Users and Check Access
        uses: ./.github/actions/check-workerimages-user-authorization
        with:
          app_id: ${{ secrets.WORKER_IMAGES_TEAMS_APP_ID }}
          private_key: ${{ secrets.WORKER_IMAGES_TEAMS_KEY }}

  packer:
    needs: [check-access, prepare-matrix]
    name: "Build ${{ matrix.config }}"
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Build Azure image
        uses: ./.github/actions/build-azure-worker-image
        with:
          config: ${{ matrix.config }}
          client_id: ${{ secrets[matrix.client_id_secret] }}
          subscription_id: ${{ secrets[matrix.subscription_id_secret] }}
          application_id: ${{ secrets[matrix.application_id_secret] }}
          tenant_id: ${{ secrets.AZURE_TENANT_ID }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          build_date: ${{ needs.prepare-matrix.outputs.build_date }}
          max_attempts: '1'
      - name: Upload Release Notes Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-notes-${{ matrix.config }}
          path: ${{ matrix.config }}-${{ env.sharedimageversion }}.md
          overwrite: true
          retention-days: 90
          if-no-files-found: error

  sbom:
    if: ${{ always() }}
    needs: [prepare-matrix, packer]
    permissions:
      actions: read
      contents: write
    uses: ./.github/workflows/upload-release-notes.yml

  os-integration:
    needs: [prepare-matrix, packer]
    name: "OS Integration Tests - ${{ matrix.config }}"
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare-matrix.outputs.os_integration_matrix) }}
    uses: ./.github/workflows/os-integration.yml
    with:
      config: ${{ matrix.config }}
    secrets:
      TASKCLUSTER_OS_INT_CLIENT_ID: ${{ secrets.TASKCLUSTER_OS_INT_CLIENT_ID }}
      TASKCLUSTER_OS_INT_ACCESS_TOKEN: ${{ secrets.TASKCLUSTER_OS_INT_ACCESS_TOKEN }}
