run-name: TCEng Azure - ${{ github.event.inputs.config }}
name: TCEng Azure

on:
  workflow_dispatch:
    inputs:
      config:
        type: string
        required: true
        description: YAML basename from config/ (without .yaml)
      TASKCLUSTER_REF:
        type: string
        description: Git reference (branch, tag, or commit) to use
        default: main

permissions:
  id-token: write
  contents: read

env:
  CONFIG: ${{ inputs.config }}

jobs:
  check-access:
    name: "Verify User Access"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Validate image config
        shell: pwsh
        run: ./ci/validate-image-config.ps1 -Family tceng

      - name: Load Authorized Users and Check Access
        shell: pwsh
        run: ./ci/check-authorized-user.ps1 -IncludeTCEng

  config:
    needs: check-access
    name: "Create Image Tasks"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Validate image config
        shell: pwsh
        run: ./ci/validate-image-config.ps1 -Family tceng

      - id: set-matrix
        shell: pwsh
        run: |
          Import-Module ${{ github.workspace }}\bin\WorkerImages\WorkerImages.psm1
          $Vars = @{
            team = "tceng"
            Key  = $env:CONFIG
          }
          Set-AzWorkerImageLocation @Vars
    outputs:
      LOCATIONS: ${{ steps.set-matrix.outputs.LOCATIONS }}
      CLIENT_ID_SECRET: ${{ steps.set-matrix.outputs.CLIENT_ID_SECRET }}
      SUBSCRIPTION_ID_SECRET: ${{ steps.set-matrix.outputs.SUBSCRIPTION_ID_SECRET }}
      APPLICATION_ID_SECRET: ${{ steps.set-matrix.outputs.APPLICATION_ID_SECRET }}

  packer:
    needs: config
    name: "${{ github.event.inputs.config }} - ${{ matrix.LOCATIONS }}"
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        locations: ${{ fromJson(needs.config.outputs.LOCATIONS) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Validate image config
        shell: pwsh
        run: ./ci/validate-image-config.ps1 -Family tceng

      # The SKU preflight uses Azure CLI; do not initialize an unused Az PowerShell session.
      - name: Azure CLI login for SKU preflight
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c
        with:
          client-id: ${{ secrets[needs.config.outputs.CLIENT_ID_SECRET] }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets[needs.config.outputs.SUBSCRIPTION_ID_SECRET] }}

      - name: Run Packer
        uses: ./.github/actions/packer-build
        with:
          builder: azure-tceng
          config: ${{ inputs.config }}
          location: ${{ matrix.LOCATIONS }}
          taskcluster-ref: ${{ inputs.TASKCLUSTER_REF }}
        env:
          CLIENT_ID: ${{ secrets[needs.config.outputs.CLIENT_ID_SECRET] }}
          SUBSCRIPTION_ID: ${{ secrets[needs.config.outputs.SUBSCRIPTION_ID_SECRET] }}
          TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          APPLICATION_ID: ${{ secrets[needs.config.outputs.APPLICATION_ID_SECRET] }}
