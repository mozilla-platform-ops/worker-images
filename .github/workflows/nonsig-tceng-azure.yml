run-name: TCEng Azure - ${{ github.event.inputs.config }}
name: TCEng Azure

on:
  workflow_dispatch:
    inputs:
      config:
        type: string
        required: true
        description: YAML basename from config/ (without .yaml)
      TASKCLUSTER_REF:
        type: string
        description: Git reference (branch, tag, or commit) to use
        default: main

permissions:
  id-token: write
  contents: read

env:
  CONFIG: ${{ inputs.config }}

jobs:
  check-access:
    name: "Verify User Access"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Validate image config
        shell: pwsh
        run: |
          & "${{ github.workspace }}/ci/validate-image-config.ps1" -Family tceng

      - name: Load Authorized Users and Check Access
        shell: pwsh
        run: |
          & "${{ github.workspace }}/ci/check-authorized-user.ps1" -IncludeTCEng

  config:
    needs: check-access
    name: "Create Image Tasks"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Validate image config
        shell: pwsh
        run: |
          & "${{ github.workspace }}/ci/validate-image-config.ps1" -Family tceng

      - id: set-matrix
        shell: pwsh
        run: |
          Import-Module ${{ github.workspace }}\bin\WorkerImages\WorkerImages.psm1
          $Vars = @{
            team = "tceng"
            Key  = $env:CONFIG
          }
          Set-AzWorkerImageLocation @Vars
    outputs:
      LOCATIONS: ${{ steps.set-matrix.outputs.LOCATIONS }}
      CLIENT_ID_SECRET: ${{ steps.set-matrix.outputs.CLIENT_ID_SECRET }}
      SUBSCRIPTION_ID_SECRET: ${{ steps.set-matrix.outputs.SUBSCRIPTION_ID_SECRET }}
      APPLICATION_ID_SECRET: ${{ steps.set-matrix.outputs.APPLICATION_ID_SECRET }}

  packer:
    needs: config
    name: "${{ github.event.inputs.config }} - ${{ matrix.LOCATIONS }}"
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        locations: ${{ fromJson(needs.config.outputs.LOCATIONS) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Validate image config
        shell: pwsh
        run: |
          & "${{ github.workspace }}/ci/validate-image-config.ps1" -Family tceng

      # The SKU preflight uses Azure CLI; do not initialize an unused Az PowerShell session.
      - name: Azure CLI login for SKU preflight
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906
        with:
          client-id: ${{ secrets[needs.config.outputs.CLIENT_ID_SECRET] }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets[needs.config.outputs.SUBSCRIPTION_ID_SECRET] }}

      - name: Prepare Packer variables
        shell: pwsh
        env:
          CLIENT_ID: ${{ secrets[needs.config.outputs.CLIENT_ID_SECRET] }}
          SUBSCRIPTION_ID: ${{ secrets[needs.config.outputs.SUBSCRIPTION_ID_SECRET] }}
          TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          APPLICATION_ID: ${{ secrets[needs.config.outputs.APPLICATION_ID_SECRET] }}
          CONFIG: ${{ inputs.config }}
          PKR_VAR_taskcluster_ref: ${{ inputs.TASKCLUSTER_REF }}
          BUILD_LOCATION: ${{ matrix.LOCATIONS }}
        run: |
          Import-Module "${{ github.workspace }}/bin/WorkerImages/WorkerImages.psm1"
          & "${{ github.workspace }}/ci/validate-image-config.ps1" -Family tceng
          Set-AzWorkerImageVariables -Team tceng -Key $env:CONFIG -Location $env:BUILD_LOCATION `
              -Client_ID $env:CLIENT_ID -Subscription_ID $env:SUBSCRIPTION_ID `
              -Tenant_ID $env:TENANT_ID -Application_ID $env:APPLICATION_ID `
              -oidc_request_url $env:ACTIONS_ID_TOKEN_REQUEST_URL -oidc_request_token $env:ACTIONS_ID_TOKEN_REQUEST_TOKEN
      - name: Run Packer
        uses: ./.github/actions/packer-build
        with:
          template: packer/tceng-azure.pkr.hcl
          only: azure-arm.nonsig
          force: 'true'
