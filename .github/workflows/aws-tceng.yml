run-name: TCEng AWS - ${{ github.event.inputs.config }}
name: TCEng AWS

on:
  workflow_dispatch:
    inputs:
      config:
        type: string
        required: true
        description: YAML basename from config/ (without .yaml)
      aws_account:
        type: choice
        description: Choose which AWS account to build in
        default: community-tc-workers
        options:
          - community-tc-workers
          - taskcluster
      region:
        type: choice
        description: Choose the AWS region to build in
        default: us-west-2
        options:
          - us-west-2
          - us-east-1
          - us-east-2
          - us-west-1
          - eu-west-1

permissions:
  id-token: write
  contents: read

env:
  CONFIG: ${{ inputs.config }}
  COMMUNITY_TC_WORKERS_AWS_ROLE_ARN: arn:aws:iam::885316786408:role/GitHubActionsRole
  TASKCLUSTER_AWS_ROLE_ARN: arn:aws:iam::692406183521:role/GitHubActionsRole

jobs:
  check-access:
    name: "Verify User Access"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Validate image config
        shell: pwsh
        run: |
          & "${{ github.workspace }}/ci/validate-image-config.ps1" -Family tceng

      - name: Load Authorized Users and Check Access
        shell: pwsh
        run: |
          & "${{ github.workspace }}/ci/check-authorized-user.ps1" -IncludeTCEng

  packer:
    needs: check-access
    name: "AWS ${{ github.event.inputs.config }}"
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Validate image config
        shell: pwsh
        run: |
          & "${{ github.workspace }}/ci/validate-image-config.ps1" -Family tceng

      - name: Select AWS role
        id: aws-role
        shell: bash
        run: |
          case "${{ github.event.inputs.aws_account }}" in
            community-tc-workers)
              echo "role-arn=${COMMUNITY_TC_WORKERS_AWS_ROLE_ARN}" >> "${GITHUB_OUTPUT}"
              ;;
            taskcluster)
              echo "role-arn=${TASKCLUSTER_AWS_ROLE_ARN}" >> "${GITHUB_OUTPUT}"
              ;;
            *)
              echo "Unsupported AWS account: ${{ github.event.inputs.aws_account }}" >&2
              exit 1
              ;;
          esac

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c
        with:
          role-to-assume: ${{ steps.aws-role.outputs.role-arn }}
          aws-region: ${{ github.event.inputs.region }}
          role-session-name: github-actions-packer-build

      - name: Prepare Packer variables
        shell: pwsh
        env:
          CONFIG: ${{ inputs.config }}
          PKR_VAR_taskcluster_ref: ""
          BUILD_LOCATION: ${{ inputs.region }}
        run: |
          Import-Module "${{ github.workspace }}/bin/WorkerImages/WorkerImages.psm1"
          & "${{ github.workspace }}/ci/validate-image-config.ps1" -Family tceng
          Set-AWSWorkerImageVariables -Key $env:CONFIG -Region $env:BUILD_LOCATION
      - name: Run Packer
        uses: ./.github/actions/packer-build
        with:
          template: packer/tceng-aws.pkr.hcl
          force: 'true'
