run-name: FXCI Azure Trusted - ${{ github.event.inputs.config }}
name: FXCI - Azure - Trusted

on:
  workflow_dispatch:
    inputs:
      config:
        type: string
        required: true
        description: YAML basename from config/ (without .yaml)

permissions:
  id-token: write
  contents: read

env:
  CONFIG: ${{ inputs.config }}

jobs:
  region-check:
    uses: ./.github/workflows/check-azure-regions.yml

  check-access:
    name: "Verify User Access"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Validate image config
        shell: pwsh
        run: ./ci/validate-image-config.ps1 -Family azure-trusted
      - name: Load Authorized Users and Check Access
        shell: pwsh
        run: ./ci/check-authorized-user.ps1

  packer:
    needs: [check-access, region-check]
    name: "Build ${{ github.event.inputs.config }}"
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Validate image config
        shell: pwsh
        run: ./ci/validate-image-config.ps1 -Family azure-trusted
      # The SKU preflight uses Azure CLI; do not initialize an unused Az PowerShell session.
      - name: Azure CLI login for SKU preflight
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID_FXCI_TRUSTED }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID_TRUSTED }}
      - name: Run Packer
        uses: ./.github/actions/packer-build
        with:
          builder: azure
          config: ${{ github.event.inputs.config }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID_FXCI_TRUSTED }}
          APPLICATION_ID: ${{ secrets.AZURE_APPLICATION_ID_FXCI_TRUSTED }}
          SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID_TRUSTED }}
          TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      - name: Upload Release Notes Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-notes-${{ github.event.inputs.config }}
          path: ${{ github.event.inputs.config }}-${{ env.sharedimageversion }}.md
          overwrite: true
          retention-days: 1
          if-no-files-found: error
  sbom:
    needs: packer
    permissions:
      actions: read
      contents: write
    uses: ./.github/workflows/upload-release-notes.yml
    with:
      artifact_pattern: release-notes-${{ github.event.inputs.config }}
      commit_message: ${{ github.event.inputs.config }} - Release Notes
