name: Image generation dev - GCP
run-name: Image generation dev - GCP - ${{ inputs.config }} - ${{ inputs.branch }}

on:
  workflow_dispatch:
    inputs:
      branch:
        description: worker-images branch to test
        required: true
        type: string
      config:
        description: Non-trusted root-level alpha config name (without .yaml)
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    # Keep authorization and credential selection in the reviewed workflow on main.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          path: trusted
          persist-credentials: false
      - name: Authorize and pin development branch
        id: source
        working-directory: trusted
        shell: pwsh
        env:
          DEV_BRANCH: ${{ inputs.branch }}
          DEV_CONFIG: ${{ inputs.config }}
        run: |
          ./ci/install-powershell-yaml.ps1
          ./ci/prepare-image-dev.ps1 -Branch $env:DEV_BRANCH -Key $env:DEV_CONFIG -Provider GCP
      - name: Check out selected commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.source.outputs.revision }}
          path: source
          persist-credentials: false
      - name: GCP login
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: projects/324168772199/locations/global/workloadIdentityPools/github-actions/providers/github-actions
          service_account: deploy-prod@taskcluster-imaging.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
      - name: Build selected revision
        working-directory: source
        shell: pwsh
        env:
          DEV_CONFIG: ${{ inputs.config }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          Import-Module ./bin/WorkerImages/WorkerImages.psm1
          New-GCPWorkerImage -Key $env:DEV_CONFIG -github_token $env:GH_TOKEN
      - name: Record development provenance
        shell: pwsh
        env:
          DEV_BRANCH: ${{ inputs.branch }}
          DEV_REVISION: ${{ steps.source.outputs.revision }}
          DEV_NOTES: ${{ steps.source.outputs.notes }}
        run: |
          $path = Join-Path source $env:DEV_NOTES
          $notes = Get-Content -LiteralPath $path -Raw -ErrorAction Stop
          "# DEV BUILD`n`nBranch: $env:DEV_BRANCH`n`nCommit: $env:DEV_REVISION`n`n$notes" |
            Set-Content -LiteralPath $path
      - name: Upload development release notes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: dev-release-notes-${{ inputs.config }}
          path: source/${{ steps.source.outputs.notes }}
          if-no-files-found: error
