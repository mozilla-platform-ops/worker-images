name: FXCI - Azure Prod Parallel Images
run-name: Azure Production Parallel - ${{ github.sha }}

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  region-check:
    uses: ./.github/workflows/check-azure-regions.yml

  prepare-matrix:
    name: Prepare Production Image Matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      os_integration_matrix: ${{ steps.set-matrix.outputs.os_integration_matrix }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install PowerShell-YAML module
        shell: pwsh
        run: ./ci/install-powershell-yaml.ps1

      - id: set-matrix
        name: Extract Azure production configs
        shell: pwsh
        run: ./ci/get-azure-production-parallel-matrix.ps1

  check-access:
    name: "Verify User Access"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Load Authorized Users and Check Access
        shell: pwsh
        run: ./ci/check-authorized-user.ps1

  packer:
    needs: [check-access, prepare-matrix, region-check]
    name: "Build ${{ matrix.config }}"
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # The SKU preflight uses Azure CLI; do not initialize an unused Az PowerShell session.
      - name: Azure CLI login for SKU preflight
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c
        with:
          client-id: ${{ secrets[matrix.client_id_secret] }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets[matrix.subscription_id_secret] }}
      - name: Cache Packer plugins
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.config/packer/plugins
          key: packer-azure-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('azure.pkr.hcl', 'packer/tceng-azure.pkr.hcl') }}
      - name: 'Run Packer'
        shell: pwsh
        env:
          APPLICATION_ID: ${{ secrets[matrix.application_id_secret] }}
          CLIENT_ID: ${{ secrets[matrix.client_id_secret] }}
          CONFIG: ${{ matrix.config }}
          DEFER_REPLICATION: 'true'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUBSCRIPTION_ID: ${{ secrets[matrix.subscription_id_secret] }}
          TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: ./ci/build-azure-shared-worker-image.ps1
      - name: Upload replication request
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: replication-${{ matrix.config }}
          path: ${{ matrix.config }}-replication.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload Release Notes Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-notes-${{ matrix.config }}
          path: ${{ matrix.config }}-${{ env.sharedimageversion }}.md
          overwrite: true
          retention-days: 1
          if-no-files-found: error

  replicate:
    needs: [prepare-matrix, packer]
    name: Replicate ${{ matrix.config }}
    runs-on: ubuntu-latest
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: replication-${{ matrix.config }}
      # This job uses the Azure CLI; Packer build jobs authenticate independently.
      - uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c
        with:
          client-id: ${{ secrets[matrix.client_id_secret] }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets[matrix.subscription_id_secret] }}
      - name: Replicate and wait for every target region
        env:
          CONFIG: ${{ matrix.config }}
        run: python3 ci/replicate-azure-image.py "$CONFIG-replication.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: deployment-ready-${{ matrix.config }}
          path: ${{ matrix.config }}-replication-ready.json
          if-no-files-found: error
          retention-days: 14

  sbom:
    if: ${{ always() }}
    needs: [prepare-matrix, packer]
    permissions:
      actions: read
      contents: write
    uses: ./.github/workflows/upload-release-notes.yml

  os-integration:
    needs: [prepare-matrix, replicate]
    name: "OS Integration Tests - ${{ matrix.config }}"
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare-matrix.outputs.os_integration_matrix) }}
    uses: ./.github/workflows/os-integration.yml
    with:
      config: ${{ matrix.config }}
    secrets:
      TASKCLUSTER_OS_INT_CLIENT_ID: ${{ secrets.TASKCLUSTER_OS_INT_CLIENT_ID }}
      TASKCLUSTER_OS_INT_ACCESS_TOKEN: ${{ secrets.TASKCLUSTER_OS_INT_ACCESS_TOKEN }}
