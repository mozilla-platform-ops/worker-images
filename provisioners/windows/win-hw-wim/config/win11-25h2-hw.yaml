---
# Baked Windows HW install.wim: Windows 11 25H2, generic hardware (hw) bake.
#
# Build:  .\bin\WinHwWim\New-WinHwWim.ps1 -Image win11-25h2-hw
#
# POC note: this reuses the NUC13 driver packs and the 24h2 bake role — the hardware
# (NUC13 / Raptor Lake) is unchanged, only the OS media moves to 25H2. Split the role
# out to a 25h2-specific one if/when the bake diverges.

base:
  # Blob in the 'base' container. Convention: <os>-base-install.wim
  wim: win11-25h2-base-install.wim
  # Fallback SOURCE: if base.wim is not present in the 'base' container, prep extracts
  # sources\install.wim from this ISO, saves it as base.wim (above), and caches it back
  # to base/ so later bakes reuse it. Lets a WIM bake start from just an uploaded ISO.
  iso: "Win11_25H2_English_x64_v2.iso"
  # Edition NAME inside the WIM; prepare-base-vhdx resolves it to the image index
  # via Get-WindowsImage (a multi-edition install.wim has several indexes).
  # Verify the exact name with: dism /Get-WimInfo /WimFile:<wim>
  edition: "Windows 11 Enterprise"

# Offline driver injection into the applied base image (DISM /Add-Driver before
# capture, so drivers land in the golden WIM). NUC13 (Arena Canyon / Raptor Lake)
# pack: without it the DISM-applied node has no Intel drivers (iGPU A7A0, Smart
# Sound audio, serial-IO/SMBus, DPTF, ISH/MEI, Bluetooth, NIC/GNA) and falls back
# to the Microsoft Basic Display Adapter (RELOPS-2487). Each URL must be publicly
# reachable (the bake downloads it with an unauthenticated Invoke-WebRequest) and be
# a .cab OR .zip that expands to an .inf tree. Source: MDT Out-of-Box Drivers.
drivers:
  inject: true
  cabs:
    # Network drivers (Intel PROSet/NIC) - public roninpuppetassets mirror (Invoke-WebRequest).
    - "https://roninpuppetassets.blob.core.windows.net/binaries/drivers/nuc13/nuc13-24h2-nuc_driver.zip"
    # Intel graphics (Raptor Lake-P Iris Xe DEV_A7A0), DCH 32.0.101.7085 from the MS Update Catalog.
    # Hosted in nucwimfxci (Entra-secured, no anon) so the bake pulls it via azcopy AAD.
    - "https://nucwimfxci.blob.core.windows.net/base/drivers/nuc13-24h2-intel-gfx-32.0.101.7085.cab"

ronin:
  org: default
  repo: default
  branch: wim-bake-role         # feature branch carrying the bake role (until merged)
  hash: "4463ab7"               # short SHA (matches deploymentId convention); ronin_puppet#1297 HEAD. Bump when the branch moves.
  bake_role: win116424h2hwbake  # trimmed hw role that performs the one-time AppX/catalog bake

vm:
  puppet_version: default
  git_version: default
  openvox_version: default
  cpus: default
  memory_mb: default
  switch_name: default
  # Production image: fully patch at bake time (shared default is OFF).
  windows_update: true

# Deploy-side metadata (informational; used for output tagging / provenance).
sharedimage:
  worker_pool_id: win11-64-25h2-hw

tags:
  base_image: win11-25h2-base-install.wim
  sourceOrganization: default
  sourceRepository: default
  sourceBranch: wim-bake-role
