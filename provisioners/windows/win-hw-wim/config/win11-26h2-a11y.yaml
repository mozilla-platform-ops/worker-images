---
# Plain single-edition WIM for the win11-26h2-a11y pool; provisioning happens at deploy.
base:
  wim: win11-26300-9457-base-install.wim
  iso: Windows11_Client_x64_en-us_26300_9457.iso
  # Must match the media exactly. The build lists available editions if absent.
  # Enterprise media is available separately; this staged consumer ISO has no Enterprise edition.
  edition: Windows 11 Pro
wim:
  plain: true
drivers:
  inject: true
  # HPE Gen12 SPP 2026.09; extracted Windows INF/SYS/CAT pack (no firmware updater).
  cabs:
    - "https://hardwareimaging.blob.core.windows.net/resources/drivers/hpe-gen12-spp-2026.09.00.00-win-driverpack-12.01.zip"
