---
# Baked Windows HW install.wim: Windows 11 24H2, generic hardware (hw) bake.
#
# Build:  .\bin\WinHwWim\New-WinHwWim.ps1 -Image win11-24h2-hw
#
# Naming is scalable across two dimensions — OS version AND specialized worker
# pool. The image id is this file's basename (win11-24h2-hw). Add a new WIM by
# dropping in another config/<image>.yaml, e.g.:
#   - win11-25h2-hw.yaml        (new OS version; new base_wim)
#   - win11-24h2-perf.yaml      (same base_wim, specialized bake_role/pool)
#   - win2022-hw.yaml           (new OS)
# Several variants can share one base_wim but differ in bake_role/worker_pool_id.

base:
  # Blob in resources/WIMs/. Convention: <os>-base-install.wim
  wim: win11-24h2-base-install.wim
  # Edition NAME inside the WIM; prepare-base-vhdx resolves it to the image index
  # via Get-WindowsImage (a multi-edition install.wim has several indexes).
  # Verify the exact name with: dism /Get-WimInfo /WimFile:<wim>
  edition: "Windows 11 Enterprise"

# Offline driver injection into the applied base image (DISM /Add-Driver before
# capture, so drivers land in the golden WIM). NUC13 (Arena Canyon / Raptor Lake)
# pack: without it the DISM-applied node has no Intel drivers (iGPU A7A0, Smart
# Sound audio, serial-IO/SMBus, DPTF, ISH/MEI, Bluetooth, NIC/GNA) and falls back
# to the Microsoft Basic Display Adapter (RELOPS-2487). Each URL must be publicly
# reachable (the bake downloads it with an unauthenticated Invoke-WebRequest) and be
# a .cab OR .zip that expands to an .inf tree. Source: MDT Out-of-Box Drivers.
drivers:
  inject: true
  # One or more driver-pack URLs, each a .cab OR a .zip (scalable — add more list
  # entries to inject extra packs; every pack is downloaded, expanded, and applied in
  # a single recursive DISM /Add-Driver before capture).
  cabs:
    # Network drivers (Intel PROSet/NIC) - public roninpuppetassets mirror (Invoke-WebRequest).
    - "https://roninpuppetassets.blob.core.windows.net/binaries/drivers/nuc13/nuc13-24h2-nuc_driver.zip"
    # Intel graphics (Raptor Lake-P Iris Xe DEV_A7A0), DCH 32.0.101.7085 from the MS Update Catalog.
    # Hosted in hardwareimaging (Entra-secured, no anon) so the bake pulls it via azcopy AAD. Proven on 160:
    # flips MS Basic Display Adapter (RR=1) -> Intel(R) Iris(R) Xe Graphics (RR=60).
    - "https://hardwareimaging.blob.core.windows.net/resources/drivers/nuc13-24h2-intel-gfx-32.0.101.7085.cab"

ronin:
  org: default
  repo: default
  branch: wim-bake-role         # feature branch carrying the bake role (until merged)
  hash: "7dac7f0a"              # ronin_puppet#1297 HEAD; bake role excludes hardware_observability (no marlin_pw lookup). Bump when the branch moves.
                                # 7dac7f0a (RELOPS-2487) SUPERSEDES b64eb0b5. b64eb0b5 stopped the bake disabling
                                # AppXSvc so the image shipped it Manual; that fixed the codecs but changed sysprep -
                                # the WIM then got a full generalize, and the first-boot specialize pass regenerated a
                                # random WIN-xxxxxxxx into ActiveComputerName, which sent maintainsystem-hw into a
                                # Set-PXE re-image loop. The bake never needed changing: the media extensions are
                                # PROVISIONED at bake time (DISM-level, no AppXSvc), and only the per-user registration
                                # at first task_* logon needs the service. So 7dac7f0a bakes the disable again and
                                # re-enables AppXSvc at DEPLOY time for ref/ref-alpha instead. Stage at bake, register
                                # at deploy.
  bake_role: win116424h2hwbake  # trimmed hw role that performs the one-time AppX/catalog bake

vm:
  puppet_version: default
  git_version: default
  openvox_version: default
  cpus: default
  memory_mb: default
  switch_name: default
  # OFF deliberately (was true; flipped 2026-08-11 after bake run 31428853582).
  # Patching at bake time fights the bake role: win116424h2hwbake includes
  # roles_profiles::profiles::disable_services -> win_disable_services::disable_windows_update,
  # which disables wuauserv. So the WU-on order was: install updates -> reboot ->
  # puppet disables the update stack -> reboot, and that last reboot never came back
  # ("A system shutdown is in progress.(1115)" -> "Timeout waiting for machine to
  # restart"), losing a 1h41m build. hw-test bakes the SAME role from the SAME branch
  # with WU off and has gone green repeatedly - windows_update was the only difference.
  # Consequence, accepted: the WIM ships at the patch level of base_wim, and the
  # deployed workers never patch themselves (that same puppet class keeps WU disabled
  # in production), so refreshing patches means uploading newer base media. Also saves
  # ~40 min per bake and makes the image content deterministic instead of build-date
  # dependent. If bake-time patching is ever wanted back, do it OFFLINE - a pinned
  # SSU+LCU .msu via DISM /Add-Package in prepare-base-vhdx.ps1 (which already does
  # offline driver injection) - not with the online WU provisioner.
  windows_update: false

# Deploy-side metadata (informational; used for output tagging / provenance).
sharedimage:
  worker_pool_id: win11-64-24h2-hw

tags:
  base_image: win11-24h2-base-install.wim
  sourceOrganization: default
  sourceRepository: default
  sourceBranch: wim-bake-role
