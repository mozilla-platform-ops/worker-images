---
# TEMP / TESTING variant of win11-24h2-hw — a throwaway image for validating the
# pipeline and bake changes WITHOUT touching the production win11-24h2-hw output.
#
# Build:  .\bin\WinHwWim\New-WinHwWim.ps1 -Image win11-24h2-hw-test
#
# Same base WIM + edition + bake role as win11-24h2-hw; differs only in identity
# so it captures to its own namespace (captured/win11-24h2-hw-test/…) and tracks
# the bake-role branch HEAD for fast iteration. Delete this file when done testing.

base:
  wim: win11-24h2-base-install.wim
  edition: "Windows 11 Enterprise"

# NUC13 (Arena Canyon / Raptor Lake) driver pack injected offline into the base
# image before capture, so the golden WIM ships with real Intel drivers (iGPU
# A7A0, Smart Sound audio, serial-IO/SMBus, DPTF, ISH/MEI, Bluetooth, NIC/GNA).
# Without this the DISM-applied node falls back to the Microsoft Basic Display
# Adapter (RELOPS-2487). Public blob mirror (anonymous read, same host as the
# prereqs) so the bake's Invoke-WebRequest needs no auth. Each pack (.cab or .zip)
# must expand to an .inf tree. Source: MDT Out-of-Box Drivers for NUC13.
drivers:
  inject: true
  # One or more driver-pack URLs, each a .cab OR a .zip (scalable — add more list
  # entries to inject extra packs; every pack is downloaded, expanded, and applied in
  # a single recursive DISM /Add-Driver before capture).
  cabs:
    # Network drivers (Intel PROSet/NIC) - public roninpuppetassets mirror (Invoke-WebRequest).
    - "https://roninpuppetassets.blob.core.windows.net/binaries/drivers/nuc13/nuc13-24h2-nuc_driver.zip"
    # Intel graphics (Raptor Lake-P Iris Xe DEV_A7A0), DCH 32.0.101.7085 from the MS Update Catalog.
    # Hosted in hardwareimaging (Entra-secured, no anon) so the bake pulls it via azcopy AAD. Proven on 160:
    # flips MS Basic Display Adapter (RR=1) -> Intel(R) Iris(R) Xe Graphics (RR=60).
    - "https://hardwareimaging.blob.core.windows.net/resources/drivers/nuc13-24h2-intel-gfx-32.0.101.7085.cab"
    # Platform/chipset packs - kept in step with win11-24h2-hw.yaml so a test bake has the same
    # driver coverage. See that file for the full rationale (exported off the MDT reference nodes
    # nuc13-006 / t-nuc12-005, DCH graphics family pruned so it cannot fight the 7085 cab above).
    - "https://hardwareimaging.blob.core.windows.net/resources/drivers/nuc13-24h2-platform-drivers-20260827.zip"
    - "https://hardwareimaging.blob.core.windows.net/resources/drivers/nuc12-24h2-platform-drivers-20260827.zip"

ronin:
  org: default
  repo: default
  branch: wim-bake-role         # bake role branch
  hash: ""                      # testing: track branch HEAD (no pin) so iterations don't need a bump
  bake_role: win116424h2hwbake

vm:
  puppet_version: default
  git_version: default
  openvox_version: default
  cpus: default
  memory_mb: default
  switch_name: default
  # Testing: skip the slow full Windows Update pass for fast iteration (also the
  # shared default). Flip to true to validate the production WU path.
  windows_update: false

# Deploy-side metadata — test pool label so this never looks like production.
sharedimage:
  worker_pool_id: win11-64-24h2-hw-test

tags:
  base_image: win11-24h2-base-install.wim
  sourceOrganization: default
  sourceRepository: default
  sourceBranch: wim-bake-role
  temp: "true"
