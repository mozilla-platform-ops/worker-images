---
# Windows 11 24H2 requirement-bypass ISO — a DISTINCT function from the ronin base WIM
# bakes (config/win11-24h2-hw*.yaml). Build:  New-WinHwWim -Image win11-24h2-iso
#
# Config shape mirrors the WIM configs (base: + a provisioning source), but the provisioning
# source is `scripts:` (inject-library scripts) instead of `ronin:` (clone+apply ronin_puppet).
# A config uses EITHER ronin OR scripts, not both.

base:
  # Source media: a base Win11 24H2 ISO you upload to the 'base' container (yaml value).
  iso: "win11-24h2-base.iso"

# Provisioning = inject-library scripts (scripts/inject/<name>.ps1) run against the extracted
# media before repackaging. Each name is a reusable script; add more by dropping one in + naming it.
scripts:
  - nocheck        # bypass TPM/SecureBoot/RAM/CPU/storage checks (LabConfig + MoSetup autounattend)

iso:
  enabled: true                          # build the ISO (iso stage) instead of the WIM bake
  output_blob: "win11-24h2-nocheck.iso"  # written to the 'base' container (default: <base.iso>-nocheck.iso)
  label: "WIN11_24H2_NOCHK"
