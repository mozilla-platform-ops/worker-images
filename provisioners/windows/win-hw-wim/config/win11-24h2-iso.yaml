---
# Windows 11 24H2 requirement-bypass ISO — a DISTINCT function from the ronin base WIM
# bakes (config/win11-24h2-hw*.yaml). This config is consumed ONLY by the 'iso' stage and
# has NO base/ronin/vm sections (they belong to the WIM bake, not here).
#
# Build:  .\bin\WinHwWim\New-WinHwWim.ps1 -Image win11-24h2-iso -Stages iso
#
# The iso stage: azcopy-downloads base/<source_blob> (a base Win11 24H2 ISO you upload to
# the 'base' container), injects an autounattend.xml that writes the HKLM\SYSTEM\Setup\LabConfig
# bypass keys (TPM/SecureBoot/RAM/CPU/storage) + MoSetup during windowsPE, repackages a bootable
# ISO with oscdimg (ADK), and uploads base/<output_blob> (+ .sha256). Clean-installs Win11 on
# unsupported hardware. See scripts/create-iso.ps1 and README (iso stage).

iso:
  # Base Win11 24H2 ISO blob in the 'base' container (upload it there first).
  source_blob: "win11-24h2-base.iso"
  # Output requirement-bypass ISO blob name in 'base' (default: <source>-nocheck.iso).
  output_blob: "win11-24h2-nocheck.iso"
  # Volume label for the built ISO.
  label: "WIN11_24H2_NOCHK"
